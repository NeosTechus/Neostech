<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
  <title>Neos Techs | Web Development, AI Agents & Digital Solutions</title>
  <meta name="description" content="Neos Techs delivers cutting-edge full-stack web solutions, AI agents, custom software development, and digital consulting to transform your business." />
  <meta name="author" content="Neos Techs" />
  <meta name="keywords" content="web development, AI agents, custom software, digital consulting, React, NeosTechs, Saint Louis" />
  <link rel="canonical" href="https://neostechus.com" />

  <!-- Open Graph fallbacks (per-route values injected by react-helmet-async) -->
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:site" content="@NeosTechs" />
  <meta name="theme-color" content="#0a1426" />
  <meta name="robots" content="index,follow" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Neos Techs",
    "url": "https://neostechus.com",
    "logo": "https://neostechus.com/logo.png",
    "description": "Neos Techs delivers cutting-edge full-stack web solutions, AI agents, custom software development, and digital consulting.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Saint Louis",
      "addressRegion": "MO",
      "addressCountry": "US"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+1-314-978-2326",
      "email": "info@neostechus.com",
      "contactType": "customer service"
    },
    "sameAs": []
  }
  </script>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
